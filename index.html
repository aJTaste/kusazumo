<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3eedf">
<title>草相撲</title>
<style>
:root{--bg:#f3eedf;--fg:#26331f;--card:#fffaf0;--line:#cfc4a6;--ac:#3f8f3a;--bad:#b3402e;--mute:#6b7560;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171c14;--fg:#e6ecd8;--card:#222a1d;--line:#3b4733;--ac:#7cc46f;--bad:#e0705c;--mute:#9aa68c}}
:root[data-theme="dark"]{--bg:#171c14;--fg:#e6ecd8;--card:#222a1d;--line:#3b4733;--ac:#7cc46f;--bad:#e0705c;--mute:#9aa68c}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif}
main{max-width:680px;margin:0 auto;padding:16px}
h1{font:700 34px/1.2 "Hiragino Mincho ProN","Yu Mincho",serif;margin:8px 0;color:var(--ac);letter-spacing:.2em}
canvas{width:100%;display:block;background:var(--card);border:2px solid var(--line);border-radius:12px;touch-action:none}
#pad{aspect-ratio:640/260;cursor:crosshair}#arena{aspect-ratio:640/300}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
button,input[type=text]{font:inherit;padding:10px 16px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--fg)}
button{cursor:pointer;font-weight:700}button:disabled{opacity:.45;cursor:default}button.pri{background:var(--ac);border-color:var(--ac);color:var(--bg)}
input[type=text]{width:7em;text-align:center}
.stat{font-weight:700;margin:8px 0}.tip,.sub{color:var(--mute);font-size:14px;margin:4px 0}
.box{border:2px dashed var(--line);border-radius:12px;padding:12px;margin-top:14px}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px;font-size:14px}
.bar{height:14px;background:var(--line);border-radius:7px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:var(--ac);transition:width .1s}
.info{min-height:1.6em;font-weight:700;text-align:center;margin:8px 0}
.tap{width:100%;height:96px;font-size:30px;background:var(--ac);border-color:var(--ac);color:var(--bg);touch-action:manipulation;user-select:none}
#online{display:inline-block;margin:6px 0 10px;padding:4px 10px;border:1px solid var(--line);border-radius:999px}
.netrow{display:flex;gap:8px;flex-wrap:wrap}.netrow button{flex:1}
@media(max-width:420px){main{padding:12px}h1{font-size:30px}.row{gap:7px}.netrow{display:grid;grid-template-columns:1fr 1fr}.netrow button{min-width:0;padding:9px 8px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
</head>
<body>
<main>
<h1>草相撲</h1>
<p id="online" class="sub">オンライン人数を確認中…</p>
<section id="draw">
<p class="sub">オオバコの茎のように、自分の草を一本描いて引っ張り合おう。先に切れたほうが負け！</p>
<canvas id="pad"></canvas>
<div class="row"><label>太さ <input id="w" type="range" min="2" max="16" value="6"></label><button id="clr">描き直す</button></div>
<p id="stat" class="stat"></p>
<p class="tip">太くてまっすぐ＝丈夫だけど引きは弱い／ギザギザ＝引きが強いけど切れやすい</p>
<div class="box">
<div class="netrow"><button id="cpu" class="pri" disabled>CPUと対戦</button><button id="random" disabled>ランダムマッチ</button></div>
<div class="row"><input id="code" type="text" maxlength="12" aria-label="部屋コード"><button id="net" disabled>部屋コードで対戦</button></div>
<p class="tip">同じ部屋コードを入力した2人で対戦できます。ランダムマッチでは待機中の相手と自動でマッチします。</p>
<p class="tip">オンライン対戦はログイン不要です。PeerJSの接続環境によっては通信できない場合があります。</p>
</div>
</section>
<section id="match" hidden>
<div class="bars"><div>あなた<div class="bar"><i id="bm"></i></div></div><div>あいて<div class="bar"><i id="bo"></i></div></div></div>
<canvas id="arena"></canvas>
<p id="info" class="info"></p>
<button id="tap" class="tap" disabled>引く！（スペースキー連打）</button>
<div class="row"><button id="go" hidden>準備OK</button><button id="back">やめる</button></div>
</section>
</main>
<script>
const $=s=>document.querySelector(s),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),K=0.11;
const cv=$('#pad'),cx=cv.getContext('2d'),ar=$('#arena'),ax=ar.getContext('2d'),dpr=Math.min(2,devicePixelRatio||1);
function fit(c,w,h){c.width=w*dpr;c.height=h*dpr;c.getContext('2d').setTransform(dpr,0,0,dpr,0,0)}
fit(cv,640,260);fit(ar,640,300);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const S={mode:null,state:'idle'};
let raw=[],drawing=false,me=null,opp=null,myHp=1,oppHp=1,myTaps=0,oppC=0,sent=0,tension=0,res=null,endAt=0,cd='';
let peerClient=null,peerId='',room=null,activeConn=null,expectedPeer='',pendingConnections=new Map(),unsubs=[];
let cpuT=0,sendT=0,hbTimer=0,matchTimer=0,searchMode=null,searchBusy=false,searchDeadline=0,activeRoomCode='';
const sessionId=(crypto.randomUUID?crypto.randomUUID():('s_'+Math.random().toString(36).slice(2)+Date.now().toString(36)));
$('#code').value=Math.random().toString(36).slice(2,6);

async function apiPost(data){
 const response=await fetch('/api/match',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,sessionId})});
 const payload=await response.json().catch(()=>({}));
 if(!response.ok)throw new Error(payload.error||`通信エラー (${response.status})`);
 return payload;
}
function showOnline(n){$('#online').textContent=Number.isFinite(Number(n))?`オンライン人数：約 ${Number(n)} 人`:'オンライン人数を取得できません';}
async function heartbeat(){if(!peerId)return;try{const r=await apiPost({action:'heartbeat'});showOnline(r.online)}catch(e){$('#online').textContent='オンライン人数：取得できません';console.warn(e)}}
function startHeartbeat(){clearInterval(hbTimer);heartbeat();hbTimer=setInterval(heartbeat,30000)}
function initPeer(){
 if(!window.Peer){$('#online').textContent='PeerJSを読み込めませんでした';return}
 peerClient=new Peer(undefined,{debug:1});
 peerClient.on('open',id=>{peerId=id;stat();startHeartbeat();});
 peerClient.on('connection',conn=>{
  // Matching may be reported by Redis a moment after PeerJS delivers the connection.
  // Attach immediately so the first hello packet is not lost during that race.
  if(S.mode==='net'&&(S.state==='wait'||S.state==='ready')&&(!expectedPeer||conn.peer===expectedPeer))attachConnection(conn);
  else conn.close();
 });
 peerClient.on('disconnected',()=>{try{peerClient.reconnect()}catch(e){console.warn(e)}});
 peerClient.on('error',e=>{console.warn('PeerJS:',e);if(e.type==='peer-unavailable'&&S.mode==='net')info('相手への接続に失敗しました。もう一度お試しください。')});
}

function resample(p,s){const o=[p[0]];let l=p[0];for(const q of p){if(Math.hypot(q[0]-l[0],q[1]-l[1])>=s){o.push(q);l=q}}return o}
function norm(r){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const[x,y]of r){a=Math.min(a,x);b=Math.min(b,y);c=Math.max(c,x);d=Math.max(d,y)}
 const k=1000/Math.max(c-a,d-b,1),st=Math.ceil(r.length/90),p=[];
 for(let i=0;i<r.length;i+=st)p.push([Math.round((r[i][0]-a)*k),Math.round((r[i][1]-b)*k)]);
 const e=r[r.length-1];p.push([Math.round((e[0]-a)*k),Math.round((e[1]-b)*k)]);return p}
function stats(w,wig,L){const lf=clamp(L/400,.3,1.2);return{hp:Math.round((30+w*6)*(1.3-.6*wig)*(.6+.4*lf)),pw:Math.round(10*(.7+wig*.8+lf*.3)*10)/10}}
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*640/r.width,(e.clientY-r.top)*260/r.height]}
function redraw(){cx.clearRect(0,0,640,260);
 if(!raw.length){cx.fillStyle=css('--mute');cx.font='20px sans-serif';cx.textAlign='center';cx.fillText('ここに草を一本描いてね',320,135);return}
 cx.strokeStyle=css('--ac');cx.lineWidth=+$('#w').value;cx.lineCap=cx.lineJoin='round';cx.beginPath();raw.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));if(raw.length==1)cx.lineTo(raw[0][0]+.1,raw[0][1]);cx.stroke()}
function stat(m){$('#stat').textContent=m||(me?`耐久 ${me.hp} ／ 引き ${me.pw}`:'まず草を描いてね');$('#cpu').disabled=!me;$('#net').disabled=!me||!peerId;$('#random').disabled=!me||!peerId}
function finishStem(){const r=resample(raw,8);if(r.length<6){me=null;return stat('もう少し長く描いてね')}
 let L=0,T=0,pa=null;for(let i=1;i<r.length;i++){const dx=r[i][0]-r[i-1][0],dy=r[i][1]-r[i-1][1];L+=Math.hypot(dx,dy);const a=Math.atan2(dy,dx);if(pa!==null){let d=Math.abs(a-pa);if(d>Math.PI)d=2*Math.PI-d;T+=d}pa=a}
 const wig=clamp(T/(r.length-2)/.8,0,1),w=+$('#w').value;me={p:norm(r),w,wig,...stats(w,wig,L)};stat()}
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);drawing=true;raw=[pos(e)];me=null;redraw();stat()};
cv.onpointermove=e=>{if(!drawing)return;const p=pos(e),l=raw[raw.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])>2){raw.push(p);redraw()}};
cv.onpointerup=cv.onpointercancel=()=>{if(drawing){drawing=false;finishStem()}};
$('#w').oninput=()=>{redraw();if(raw.length&&!drawing)finishStem()};
$('#clr').onclick=()=>{raw=[];me=null;redraw();stat()};
redraw();stat();

function show(id){['draw','match'].forEach(i=>$('#'+i).hidden=i!==id)}
const info=t=>$('#info').textContent=t;
function genCpu(){const wig=Math.random()*.8+.1,w=4+Math.random()*9,a=[];for(let i=0;i<60;i++)a.push([i*16,Math.sin(i/60*(3+wig*10))*wig*120]);return{p:norm(a),w,wig,...stats(w,wig,300+Math.random()*100)}}
function prepare(){myHp=me.hp;oppHp=opp?opp.hp:1;myTaps=oppC=sent=0;tension=0;res=null;info('')}
function beginCount(){S.state='count';let n=3;cd='3';const iv=setInterval(()=>{n--;if(n>0)cd=String(n);else{clearInterval(iv);cd='引け！';S.state='fight';startTimers();setTimeout(()=>cd='',700)}},800)}
function startTimers(){clearInterval(cpuT);clearInterval(sendT);
 if(S.mode==='cpu')cpuT=setInterval(()=>{if(S.state==='fight')oppHit(Math.random()<.7?1:0)},150);
 else sendT=setInterval(()=>{if(S.state==='fight'&&room&&myTaps!==sent){sent=myTaps;room.emit('tap',{c:myTaps}).catch(()=>{})}},120)}
function oppHit(d){myHp-=d*opp.pw*K;tension=Math.min(1,tension+d*.15)}
function myTap(){if(S.state!=='fight')return;myTaps++;oppHp-=me.pw*K;tension=Math.min(1,tension+.15)}
function finish(r){if(S.state==='done')return;S.state='done';res=r;endAt=performance.now();clearInterval(cpuT);clearInterval(sendT);msg();$('#go').hidden=(S.mode==='net'&&!room);$('#go').textContent='もう一回';$('#tap').disabled=true}
function msg(){if(res===true)info('勝ち！ 相手の草がブチッと切れた');else if(res===false)info('負け… あなたの草が切れた');else if(res==='draw')info('あいこ！ 両方ブチッ');else if(res==='disconnect')info('通信が切れました。対戦を終了しました');}
function tick(){tension*=.94;
 if(S.state==='fight'){if(myHp<=0){if(S.mode==='net'&&room)room.emit('broke',{}).catch(()=>{});finish(false)}else if(S.mode==='cpu'&&oppHp<=0)finish(true)}
 $('#tap').disabled=S.state!=='fight';
 if(me)$('#bm').style.width=clamp(myHp/me.hp,0,1)*100+'%';$('#bo').style.width=(opp?clamp(oppHp/opp.hp,0,1)*100:100)+'%';
 drawArena();requestAnimationFrame(tick)}
function stem(s,mir,f,dx,broken){let mx=1,my=1;for(const[x,y]of s.p){mx=Math.max(mx,x);my=Math.max(my,y)}
 const bx=mir?340:20,bw=280,by=30,bh=220,k=Math.min(bw/mx,bh/my),ox=bx+(bw-mx*k)/2+dx,oy=by+(bh-my*k)/2;
 const P=s.p.map(([x,y])=>[ox+(mir?mx-x:x)*k,oy+y*k]);f=clamp(f,0,1);
 ax.lineCap=ax.lineJoin='round';ax.lineWidth=clamp(s.w*.8,3,12);ax.strokeStyle=`hsl(${35+85*f} 55% 42%)`;
 const path=(a,ex,ey)=>{ax.beginPath();a.forEach((p,i)=>i?ax.lineTo(p[0]+ex,p[1]+ey):ax.moveTo(p[0]+ex,p[1]+ey));ax.stroke()};
 if(broken){const e=clamp((performance.now()-endAt)/300,0,1),h=P.length>>1,q=mir?1:-1;path(P.slice(0,h+1),-10*e*q,-8*e);path(P.slice(h),10*e*q,8*e);return}
 path(P,0,0);const n=Math.floor((1-f)*6);ax.strokeStyle=css('--bad');ax.lineWidth=2;
 for(let i=0;i<n;i++){const p=P[Math.floor((i+1)/(n+1)*(P.length-1))];ax.beginPath();ax.moveTo(p[0]-6,p[1]-6);ax.lineTo(p[0]+1,p[1]);ax.lineTo(p[0]-3,p[1]+7);ax.stroke()}}
function drawArena(){ax.clearRect(0,0,640,300);ax.fillStyle=css('--card');ax.fillRect(0,0,640,300);ax.fillStyle=css('--line');ax.fillRect(0,276,640,24);
 if(!me)return;const sh=(Math.random()-.5)*tension*8,d=S.state==='done';
 stem(me,false,myHp/me.hp,-tension*10+sh,d&&res!==true);
 if(opp)stem(opp,true,oppHp/opp.hp,tension*10-sh,d&&res!==false);
 if(opp){ax.strokeStyle=css('--ac');ax.lineWidth=4;for(const x of[305,335]){ax.beginPath();ax.ellipse(x,150,16,10,0,0,7);ax.stroke()}}
 if(cd){ax.fillStyle=css('--fg');ax.font='700 56px sans-serif';ax.textAlign='center';ax.fillText(cd,320,100)}}
requestAnimationFrame(tick);

function makeRoomAdapter(conn){
 const listeners=new Map();
 conn.on('data',packet=>{if(!packet||typeof packet.type!=='string')return;const set=listeners.get(packet.type);if(set)for(const fn of [...set]){try{fn({isMe:false,peer:conn.peer,data:packet.data})}catch(e){console.warn(e)}}});
 return{
  emit(type,data){return new Promise((resolve,reject)=>{if(!conn.open)return reject(new Error('接続がまだ開いていません'));try{conn.send({type,data});resolve()}catch(e){reject(e)}})},
  on(type,fn){if(!listeners.has(type))listeners.set(type,new Set());listeners.get(type).add(fn);return()=>listeners.get(type)?.delete(fn)},
  leave(){conn.close();return Promise.resolve()}
 };
}
function attachConnection(conn){
 if(activeConn&&activeConn!==conn){if(activeConn.peer===conn.peer){conn.close();return}conn.close();return}
 activeConn=conn;expectedPeer=conn.peer;pendingConnections.delete(conn.peer);room=makeRoomAdapter(conn);
 unsubs=[room.on('hello',onHello),room.on('ready',onReady),room.on('tap',onTap),room.on('broke',onBroke)];
 const opened=()=>{if(activeConn!==conn)return;info('接続しました。草の状態を交換しています…');sendHello()};
 conn.on('open',opened);conn.on('close',()=>{if(activeConn!==conn)return;activeConn=null;room=null;unsubs=[];clearInterval(sendT);if(S.state==='fight')finish('disconnect');else if(S.state==='done')$('#go').hidden=true;else if(S.mode==='net'){S.state='wait';$('#go').hidden=true;info('相手との接続が切れました。戻って再接続してください')}});
 conn.on('error',e=>{console.warn('DataConnection:',e);if(S.state!=='done')info('通信エラーが発生しました')});
 if(conn.open)opened();
}
function connectToOpponent(remotePeerId){
 if(!validPeerId(remotePeerId)||remotePeerId===peerId){info('対戦相手のIDが不正です');return}
 expectedPeer=remotePeerId;
 if(activeConn){if(activeConn.peer===remotePeerId)return;activeConn.close();activeConn=null;room=null}
 if(peerId.localeCompare(remotePeerId)<0){info('相手に接続しています…');const conn=peerClient.connect(remotePeerId,{reliable:true,serialization:'json'});attachConnection(conn)}
 else info('相手からの接続を待っています…');
}
function validPeerId(s){return typeof s==='string'&&/^[a-zA-Z0-9_-]{4,128}$/.test(s)}
function sendHello(){if(room&&me)room.emit('hello',{p:me.p,w:me.w,hp:me.hp,pw:me.pw}).catch(()=>{})}
function onHello(m){if(m.isMe||(opp&&opp.peer!==m.peer))return;const d=m.data||{};
 if(!Array.isArray(d.p)||d.p.length<2||d.p.length>100||!['wait','ready','done'].includes(S.state))return;
 const first=S.state==='wait';
 opp={peer:m.peer,p:d.p.map(a=>[clamp(+a[0]||0,0,1000),clamp(+a[1]||0,0,1000)]),w:clamp(+d.w||6,2,16),hp:clamp(+d.hp||80,20,200),pw:clamp(+d.pw||10,3,25)};
 if(first){S.state='ready';prepare();$('#go').hidden=false;$('#go').textContent='準備OK';info('相手が来ました！準備OKを押してね')}else if(S.state==='ready'){oppHp=opp.hp}}
function onReady(m){if(m.isMe||!opp||m.peer!==opp.peer)return;readyOpp=true;maybeStart()}
function onTap(m){if(m.isMe||!opp||m.peer!==opp.peer)return;const c=+(m.data&&m.data.c)||0,d=clamp(c-oppC,0,30);oppC=c;if(S.state==='fight')oppHit(d)}
function onBroke(m){if(m.isMe||!opp||m.peer!==opp.peer)return;if(S.state==='fight')finish(true);else if(S.state==='done'&&res===false){res='draw';msg()}}
function maybeStart(){if(readyMe&&readyOpp&&(S.state==='ready'||S.state==='done')){readyMe=readyOpp=false;prepare();beginCount()}}
let readyMe=false,readyOpp=false;

async function clean(notify=true){
 const oldCode=activeRoomCode,wasNet=S.mode==='net'||!!searchMode;
 clearInterval(cpuT);clearInterval(sendT);clearInterval(matchTimer);searchMode=null;searchBusy=false;
 unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];
 const old=activeConn;activeConn=null;room=null;if(old){try{old.close()}catch(e){}}
 for(const c of pendingConnections.values()){try{c.close()}catch(e){}}pendingConnections.clear();expectedPeer='';opp=null;readyMe=readyOpp=false;cd='';
 if(notify&&wasNet&&peerId){try{await apiPost({action:'cancel',roomCode:oldCode})}catch(e){console.warn('cancel:',e)}}
 activeRoomCode='';S.mode=null;S.state='idle';
}

async function pollSearch(){
 if(!searchMode||searchBusy)return;searchBusy=true;
 try{
  const data=searchMode==='random'?{action:'matchmake',peerId}:{action:'room-join',peerId,roomCode:activeRoomCode};
  const result=await apiPost(data);if(Number.isFinite(Number(result.online)))showOnline(result.online);
  if(result.status==='matched'&&result.peerId){const remote=result.peerId;searchMode=null;clearTimeout(matchTimer);info('相手が見つかりました。接続しています…');connectToOpponent(remote);return}
  if(searchMode==='random')info('対戦相手を探しています…（オンライン '+(result.online??'?')+' 人）');
  else info('部屋「'+activeRoomCode+'」で相手を待っています…');
  if(searchMode==='random'&&Date.now()>searchDeadline){searchMode=null;clearTimeout(matchTimer);await apiPost({action:'cancel'});info('相手が見つかりませんでした。もう一度お試しください');return}
 }catch(e){const failedCode=activeRoomCode;searchMode=null;clearTimeout(matchTimer);info('オンライン対戦に接続できません：'+e.message);apiPost({action:'cancel',roomCode:failedCode}).catch(()=>{})}
 finally{searchBusy=false;if(searchMode)matchTimer=setTimeout(pollSearch,searchMode==='random'?1400:2200)}
}
async function startSearch(mode,code=''){
 if(!me)return;if(!peerId){stat('PeerJSに接続中です。少し待ってください');return}
 await clean();S.mode='net';S.state='wait';searchMode=mode;activeRoomCode=code;searchDeadline=Date.now()+120000;
 show('match');prepare();S.state='wait';$('#go').hidden=true;
 info(mode==='random'?'ランダムマッチで相手を探しています…':'部屋「'+code+'」で相手を待っています…');
 pollSearch();
}
$('#random').onclick=()=>startSearch('random');
$('#net').onclick=()=>{const code=$('#code').value.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,12);if(code.length<2){stat('部屋コードは2文字以上にしてね');return}startSearch('room',code)};
$('#cpu').onclick=async()=>{await clean();S.mode='cpu';opp=genCpu();show('match');prepare();$('#go').hidden=true;beginCount()};
$('#go').onclick=()=>{$('#go').hidden=true;
 if(S.mode==='cpu'){opp=genCpu();prepare();beginCount();return}
 if(!room){info('通信が切れています。対戦をやめて入り直してください');return}
 readyMe=true;room.emit('ready',{}).catch(()=>{});info('相手の準備を待っています…');maybeStart()};
$('#tap').onpointerdown=e=>{e.preventDefault();myTap()};
addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&S.state==='fight'){e.preventDefault();if(!e.repeat)myTap()}});
$('#back').onclick=async()=>{await clean();show('draw');stat()};
addEventListener('beforeunload',()=>{if(peerId){const payload=JSON.stringify({action:'leave',sessionId,roomCode:activeRoomCode});try{navigator.sendBeacon('/api/match',new Blob([payload],{type:'application/json'}))}catch(e){}}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)heartbeat()});
initPeer();
</script>
