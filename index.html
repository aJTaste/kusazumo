<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3fb7ff">
<title>草相撲｜連打で草を引っこ抜け！</title>
<meta name="description" content="自分で描いた草で戦う連打バトル。CPU対戦・友達と部屋コード対戦・ランダムマッチ。君は何連勝できる？">
<meta property="og:title" content="草相撲">
<meta property="og:description" content="自分で描いた草で戦う連打バトル！君は何連勝できる？">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a2b1c;--paper:#fffdf3;--grass:#35d65c;--grass-d:#17893a;--hot:#ff3d5a;--gold:#ffd60a;--mute:#4f6a54;
--disp:"Mochiy Pop One","Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
--body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;color:var(--ink);font:500 16px/1.55 var(--body);background:#46bfff;-webkit-tap-highlight-color:transparent}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,#3fb7ff 0,#b9ecff 50%,#d8f6a8 100%)}
body:after{content:"";position:fixed;left:0;right:0;bottom:0;height:44px;z-index:-1;background:linear-gradient(#3ccf5a,#27a649);border-top:3px solid var(--ink)}
main{max-width:560px;margin:0 auto;padding:10px 14px 70px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:4px solid #7a3cff;outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.logo{margin:4px 0 0 4px;font:400 clamp(46px,14vw,64px)/1.05 var(--disp);letter-spacing:.06em;color:#38e05f;-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);transform:rotate(-2deg)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.lv{flex:1 1 190px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:3px 10px 6px}
.lv b{font:400 15px/1.6 var(--disp)}
.xp{height:11px;background:#d7e6cf;border:2px solid var(--ink);border-radius:6px;overflow:hidden;margin-top:2px}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd60a,#ff9f1c);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.chip{background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:3px 12px;font:700 14px/1.6 var(--body);white-space:nowrap}
#streakChip.hot{background:#ffe08a;animation:wob .6s ease-in-out infinite alternate}
@keyframes wob{to{transform:rotate(-3deg) scale(1.06)}}

.card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:14px;box-shadow:0 6px 0 var(--ink);margin-top:16px}
h2{font:400 20px/1.35 var(--disp);margin:0 0 2px}
.sub,.tip{color:var(--mute);font-size:13.5px;margin:4px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.btn{font-family:var(--disp);font-weight:400;border:3px solid var(--ink);border-radius:16px;background:#fff;padding:10px 14px;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .06s,box-shadow .06s;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.5;filter:grayscale(.5);cursor:default}
.btn.sm{padding:5px 11px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.btn.sm:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.pri{background:var(--grass)}.btn.hot{background:var(--hot);color:#fff}.btn.gold{background:var(--gold)}
.big{width:100%;padding:15px;font-size:24px;border-radius:20px}
.icon{padding:4px 10px;font-size:18px;box-shadow:0 3px 0 var(--ink);border-radius:12px}
input[type=text]{width:7.5em;text-align:center;border:3px solid var(--ink);border-radius:12px;padding:8px;background:#fff}
input[type=range]{accent-color:var(--grass-d);flex:1;min-width:120px}

#pad{width:100%;display:block;aspect-ratio:640/260;margin-top:8px;border:3px dashed #7a9a6a;border-radius:14px;cursor:crosshair;touch-action:none;background:#fffef6 radial-gradient(#dfe6cb 1.5px,transparent 1.6px) 0 0/18px 18px}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 4px}
.meter{font:400 14px/1.5 var(--disp)}.meter span{float:right}
.mbar{clear:both;height:13px;border:2px solid var(--ink);border-radius:7px;background:#e7ecd9;overflow:hidden}
.mbar i{display:block;height:100%;width:0;transition:width .25s}
#mHpBar{background:#3ccf5a}#mPwBar{background:#ff8a1f}
.skins{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.skin{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 5px;border:3px solid var(--ink);border-radius:999px;background:#fff;font:700 13px/1.6 var(--body);cursor:pointer}
.skin.on{background:#fff3a0;box-shadow:0 0 0 3px var(--gold)}.skin.lock{opacity:.55}.skin small{color:var(--mute);font-weight:700}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);display:inline-block;flex:none}
.netrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.netrow .btn{font-size:16px;padding:12px 6px}
.codebox{display:flex;gap:8px;align-items:center;margin-top:12px}.codebox .btn{flex:1;font-size:16px;padding:10px 6px}
.invite{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff3a0;border:3px solid var(--ink);border-radius:16px;padding:10px 12px;margin-top:14px;font-weight:700}
.invite span{flex:1 1 180px}

.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.nm{display:flex;gap:6px;align-items:center;font:400 14px/1.6 var(--disp);min-width:0}
.side.opp .nm{justify-content:flex-end}
.hp{height:22px;border:3px solid var(--ink);border-radius:12px;background:#fff;overflow:hidden}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(#8dffa6,#2fd15a);transition:width .08s}
.side.opp .hp i{margin-left:auto;background:linear-gradient(#ffa6a6,#ff4d4d)}
.hp.low i{background:linear-gradient(#ffb3b3,#ff3d5a);animation:blink .25s infinite alternate}
@keyframes blink{to{filter:brightness(1.35)}}
.vs{font:400 22px/1 var(--disp);color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;padding-bottom:2px}
.stage{position:relative;margin-top:8px;border:3px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 6px 0 var(--ink);background:#7fd6ff;-webkit-user-select:none;user-select:none}
#arena{width:100%;display:block;aspect-ratio:640/360;touch-action:manipulation}
.result{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;pointer-events:none;background:radial-gradient(rgba(10,20,10,.55),rgba(10,20,10,.15))}
.result[hidden]{display:none}
.resTitle{font:400 clamp(50px,17vw,88px)/1.05 var(--disp);-webkit-text-stroke:10px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink);animation:drop .55s cubic-bezier(.2,1.7,.4,1) both}
.win .resTitle{color:var(--gold)}.lose .resTitle{color:#b6c0ff}.draw .resTitle{color:#fff}
@keyframes drop{0%{transform:scale(2.6) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(-2deg);opacity:1}}
.resSub{font:700 15px/1.45 var(--body);background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:2px 12px;max-width:92%}
.resXp{width:min(78%,320px);font:700 13px/1.4 var(--body);color:#fff;text-shadow:0 2px 0 var(--ink)}
.resNote{font:400 16px/1.4 var(--disp);color:var(--gold);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;min-height:1.4em}
.info{min-height:3.1em;margin:10px 0 0;font:700 15px/1.5 var(--body);text-align:center}
.dock{display:grid;margin-top:6px;min-height:118px;align-content:start}
.tapbtn{width:100%;height:118px;border:4px solid var(--ink);border-radius:30px;font:400 clamp(30px,9vw,44px)/1 var(--disp);color:#fff;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;background:linear-gradient(#78ff96,#25c24c 60%,#1c9a3b);box-shadow:0 9px 0 var(--ink),inset 0 6px 0 rgba(255,255,255,.45);cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform .05s,box-shadow .05s}
.tapbtn:not(:disabled):not(:active){animation:pulse .8s ease-in-out infinite alternate}
.tapbtn:active:not(:disabled){transform:translateY(8px) scale(.985);box-shadow:0 1px 0 var(--ink),inset 0 6px 0 rgba(255,255,255,.45)}
.tapbtn:disabled{filter:grayscale(.55) brightness(.92)}
.tapbtn[data-heat="1"]{background:linear-gradient(#fff39a,#ffc61a 60%,#f59e0b)}
.tapbtn[data-heat="2"]{background:linear-gradient(#ffc88a,#ff7a1a 60%,#e5490b)}
.tapbtn[data-heat="3"]{background:linear-gradient(#ff9ae9,#c04cff 60%,#5c3cff);animation:rainbow .7s linear infinite}
@keyframes pulse{to{transform:scale(1.025)}}
@keyframes rainbow{to{filter:hue-rotate(360deg)}}
.dock .big{height:96px;font-size:30px}
.under{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:50}
#toast{position:fixed;left:50%;bottom:calc(56px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-weight:700;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
body.inmatch .logo,body.inmatch .meta{display:none}
body.inmatch .top{justify-content:flex-end}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition-duration:.01ms!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
</head>
<body>
<main>
<div class="top">
 <h1 class="logo">草相撲</h1>
 <button id="mute" class="btn icon" type="button" aria-label="サウンドのオンオフ">🔊</button>
</div>
<div class="meta">
 <div class="lv"><b id="lvTxt">Lv.1 草の種</b><div class="xp"><i id="xpBar"></i></div></div>
 <div id="streakChip" class="chip">🔥 0連勝</div>
 <div id="online" class="chip">オンライン人数を確認中…</div>
</div>

<section id="draw">
 <div id="invite" class="invite" hidden><span>友達から招待されたよ！草を描いたら入室しよう</span><button id="joinInv" class="btn gold sm" type="button" disabled>友達の部屋に入る</button></div>
 <div class="card">
  <h2>草を一本描こう</h2>
  <p class="sub">線の形でステータスが決まるよ。描くのがめんどうなら「おまかせ」！</p>
  <canvas id="pad"></canvas>
  <div class="row">
   <button class="btn sm" type="button" data-preset="tough">どっしり</button>
   <button class="btn sm" type="button" data-preset="zig">ギザギザ</button>
   <button class="btn sm" type="button" data-preset="bal">バランス</button>
   <button id="clr" class="btn sm" type="button">描き直す</button>
  </div>
  <div class="row"><label for="w">太さ</label><input id="w" type="range" min="2" max="16" value="6"></div>
  <div class="meters">
   <div class="meter">耐久<span id="mHp">-</span><div class="mbar"><i id="mHpBar"></i></div></div>
   <div class="meter">引き<span id="mPw">-</span><div class="mbar"><i id="mPwBar"></i></div></div>
  </div>
  <p id="stat" class="stat sub">まず草を描いてね</p>
  <p class="tip">太くてまっすぐ＝丈夫だけど引きは弱い／ギザギザ＝引きが強いけど切れやすい</p>
  <div id="skins" class="skins" aria-label="草の見た目"></div>
 </div>
 <div class="card">
  <button id="cpu" class="btn pri big" type="button" disabled>CPUとたたかう！</button>
  <div class="netrow"><button id="random" class="btn" type="button" disabled>ランダムマッチ</button><button id="inviteMake" class="btn" type="button" disabled>友達を招待</button></div>
  <div class="codebox"><input id="code" type="text" maxlength="12" aria-label="部屋コード"><button id="net" class="btn" type="button" disabled>部屋コードで対戦</button></div>
  <p class="tip">友達を招待すると、URLを開いた友達とすぐ対戦できるよ。同じ部屋コードを入れた2人でも対戦できます。ログイン不要。ネットワークによっては接続できないことがあります。</p>
 </div>
</section>

<section id="match" hidden>
 <div class="hud">
  <div class="side me"><div class="nm"><i id="meDot" class="dot"></i><b>あなた</b></div><div id="hpm" class="hp"><i id="bm"></i></div></div>
  <div class="vs">VS</div>
  <div class="side opp"><div class="nm"><b id="oppName">あいて</b><i id="oppDot" class="dot"></i></div><div id="hpo" class="hp"><i id="bo"></i></div></div>
 </div>
 <div id="stage" class="stage">
  <canvas id="arena"></canvas>
  <div id="result" class="result" hidden>
   <div id="resTitle" class="resTitle">WIN!</div>
   <div id="resSub" class="resSub"></div>
   <div class="resXp"><span id="resXp"></span><div class="xp"><i id="resBar"></i></div></div>
   <div id="resNote" class="resNote"></div>
  </div>
 </div>
 <p id="info" class="info"></p>
 <div class="dock">
  <button id="tap" class="tapbtn" type="button" hidden disabled>じゅんび…</button>
  <button id="go" class="btn pri big" type="button" hidden>準備OK</button>
 </div>
 <div class="under">
  <button id="share" class="btn gold" type="button" hidden>結果をシェア</button>
  <button id="invitebtn" class="btn gold" type="button" hidden>友達を招待</button>
  <button id="back" class="btn" type="button">やめる</button>
 </div>
</section>
</main>
<div id="flash"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];
const K=0.11,W=640,H=360,INK='#1a2b1c';
const DISP='"Mochiy Pop One","Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';
// 視覚過敏への配慮：OSの「視差効果を減らす」設定なら揺れ・フラッシュを弱める
const FX=matchMedia('(prefers-reduced-motion: reduce)').matches?.35:1;

/* ===== セーブデータ（この端末のlocalStorageだけ。サーバーには送らない） ===== */
const SAVE_KEY='kusazumo.save.v2';
const save={xp:0,lv:1,wins:0,losses:0,streak:0,best:0,skin:'green',mute:false,lastWin:'',stem:null};
try{
 const o=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');
 for(const k of['xp','lv','wins','losses','streak','best'])if(Number.isFinite(+o[k])&&+o[k]>=0)save[k]=Math.floor(+o[k]);
 if(typeof o.skin==='string')save.skin=o.skin;
 save.mute=!!o.mute;
 if(typeof o.lastWin==='string')save.lastWin=o.lastWin.slice(0,10);
 if(o.stem&&Array.isArray(o.stem.p)&&o.stem.p.length>=2&&o.stem.p.length<=600)save.stem={p:o.stem.p.map(a=>[clamp(+a[0]||0,0,640),clamp(+a[1]||0,0,260)]),w:clamp(+o.stem.w||6,2,16)};
}catch(e){}
save.lv=clamp(save.lv||1,1,99);
const persist=()=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};

/* ===== レベル・称号・草スキン（スキンは見た目だけ。強さは変わらない） ===== */
const need=lv=>50+lv*20;
const TITLES=[[1,'草の種'],[2,'若芽'],[4,'ぺんぺん草'],[7,'オオバコ関'],[11,'草大関'],[15,'草横綱'],[20,'草の神']];
const titleOf=lv=>{let t=TITLES[0][1];for(const[a,b]of TITLES)if(lv>=a)t=b;return t};
const RAINBOW=Array.from({length:8},(_,i)=>`hsl(${i*45} 95% 60%)`);
const SKINS=[
 {id:'green',name:'若草',lv:1,base:'#2fb94f',cols:['#4be06a','#9af27a','#2fb94f']},
 {id:'sakura',name:'桜草',lv:2,base:'#ff7aa8',cols:['#ff8fb8','#ffc2d9','#ff5c97']},
 {id:'ice',name:'氷草',lv:4,base:'#4fc9ff',cols:['#7fe3ff','#d8f6ff','#38b6ff']},
 {id:'fire',name:'炎草',lv:7,base:'#ff7a1a',cols:['#ff9a1f','#ffd23f','#ff4d2e']},
 {id:'gold',name:'金の草',lv:11,base:'#ffc800',cols:['#ffd60a','#fff3a0','#ffb300']},
 {id:'rainbow',name:'虹草',lv:15,base:'#ff5ce1',cols:null}
];
const skinOf=id=>SKINS.find(s=>s.id===id)||SKINS[0];
if(skinOf(save.skin).lv>save.lv)save.skin='green';
const mySkin=()=>skinOf(save.skin);
const palette=s=>s.id==='rainbow'?RAINBOW:s.cols;
const dotBg=s=>s.id==='rainbow'?'conic-gradient(red,yellow,lime,cyan,blue,magenta,red)':s.base;
function stemColor(skin,f,t){
 if(f<.28&&((t/140)|0)%2)return'#ff3d5a';           // ピンチは赤く点滅
 if(skin.id==='rainbow')return`hsl(${(t/6)%360} 90% 55%)`;
 if(skin.id==='green')return`hsl(${35+85*f} 70% 44%)`; // 元気なほど緑、弱ると茶色
 return skin.base;
}

/* ===== サウンド（WebAudioで合成。音声ファイルは不要） ===== */
let AC=null,master=null;
function audio(){
 if(save.mute)return null;
 if(AC===null){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination)}catch(e){AC=false}}
 if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});
 return AC||null;
}
function tone(f,d=.12,type='square',v=.18,slide=1,delay=0){
 const a=audio();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);if(slide!==1)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);
}
function noise(d=.15,v=.25,hp=800,delay=0){
 const a=audio();if(!a)return;const n=a.sampleRate*d|0,buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
 for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);
 const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='highpass';f.frequency.value=hp;s.buffer=buf;g.gain.value=v;
 s.connect(f);f.connect(g);g.connect(master);s.start(a.currentTime+delay);
}
const PENT=[0,2,4,7,9];
const SFX={
 tap(c){const i=Math.min(c-1,19),semi=PENT[i%5]+12*Math.floor(i/5);tone(392*2**(semi/12),.09,'square',.12,1.02)}, // 連打するほど音階が上がる
 crit(){tone(880,.2,'sawtooth',.16,1.8);tone(1320,.2,'square',.1,1.5,.04);noise(.12,.2,2500)},
 hit(){tone(150,.07,'triangle',.12,.6)},
 count(){tone(520,.12,'square',.18)},
 go(){tone(1040,.25,'square',.2,1.3);noise(.1,.15,3000)},
 snap(){noise(.3,.5,500);tone(220,.25,'sawtooth',.28,.3)},
 win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.22,'square',.18,1,i*.09))},
 lose(){[392,330,262,196].forEach((f,i)=>tone(f,.28,'triangle',.22,.97,i*.14))},
 up(){[659,784,988,1319,1568].forEach((f,i)=>tone(f,.16,'square',.16,1,i*.07))},
 mile(){[784,988,1175].forEach((f,i)=>tone(f,.1,'square',.14,1,i*.05))},
 ui(){tone(660,.06,'square',.1)}
};
const vib=p=>{try{if(!save.mute&&navigator.vibrate)navigator.vibrate(p)}catch(e){}};

/* ===== 演出エンジン（パーティクル・数字・揺れ・フラッシュ） ===== */
const FXS={parts:[],texts:[],rings:[],shake:0,flash:0,flashCol:'#fff',lastFlash:0,zoom:0,combo:0,maxCombo:0,lastTap:0,comboPop:0,fever:false};

function burst(x,y,n,o={}){
 const speed=o.speed??300,g=o.g??700,life=o.life??.7,size=o.size??6,shape=o.shape||'circ',spread=o.spread??Math.PI*2,ang=o.ang??0,cols=o.cols||palette(mySkin());
 for(let i=0;i<n;i++){
  const a=ang+(Math.random()-.5)*spread,v=speed*(.35+Math.random()*.65);
  spawn({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g,life:life*(.6+Math.random()*.6),t:0,size:size*(.6+Math.random()*.8),col:pick(cols),shape,rot:shape==='line'?a:Math.random()*6.28,vr:shape==='line'?0:(Math.random()-.5)*14});
 }

const addShake=a=>{FXS.shake=Math.min(30,FXS.shake+a*FX)};
function addFlash(a,c){ // 光過敏への配慮：フラッシュは0.26秒に1回まで
 const n=performance.now();if(n-FXS.lastFlash<260)return;FXS.lastFlash=n;FXS.flash=Math.max(FXS.flash,a*FX);FXS.flashCol=c||'#fff';
}
function resetFx(){Object.assign(FXS,{parts:[],texts:[],rings:[],shake:0,flash:0,zoom:0,combo:0,maxCombo:0,lastTap:0,comboPop:0,fever:false})}
function stepFx(dt){
 FXS.shake*=Math.exp(-9*dt);if(FXS.shake<.1)FXS.shake=0;
 FXS.flash=Math.max(0,FXS.flash-dt*2.4);FXS.zoom*=Math.exp(-10*dt);FXS.comboPop=Math.max(0,FXS.comboPop-dt*6);
 const P=FXS.parts;for(let i=P.length-1;i>=0;i--){const p=P[i];p.t+=dt;if(p.t>=p.life){P.splice(i,1);continue}p.vy+=p.g*dt;p.vx*=1-1.2*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt}
 const T=FXS.texts;for(let i=T.length-1;i>=0;i--){const q=T[i];q.t+=dt;if(q.t>=q.life)T.splice(i,1);else q.y+=q.vy*dt}
 const R=FXS.rings;for(let i=R.length-1;i>=0;i--){R[i].t+=dt;if(R[i].t>=R[i].life)R.splice(i,1)}
}

/* ===== 草を描く ===== */
function resample(p,s){const o=[p[0]];let l=p[0];for(const q of p){if(Math.hypot(q[0]-l[0],q[1]-l[1])>=s){o.push(q);l=q}}return o}
function norm(r){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const[x,y]of r){a=Math.min(a,x);b=Math.min(b,y);c=Math.max(c,x);d=Math.max(d,y)}
 const k=1000/Math.max(c-a,d-b,1),st=Math.ceil(r.length/90),p=[];
 for(let i=0;i<r.length;i+=st)p.push([Math.round((r[i][0]-a)*k),Math.round((r[i][1]-b)*k)]);
 const e=r[r.length-1];p.push([Math.round((e[0]-a)*k),Math.round((e[1]-b)*k)]);return p}
function stats(w,wig,L){const lf=clamp(L/400,.3,1.2);return{hp:Math.round((30+w*6)*(1.3-.6*wig)*(.6+.4*lf)),pw:Math.round(10*(.7+wig*.8+lf*.3)*10)/10}}
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*640/r.width,(e.clientY-r.top)*260/r.height]}
function padColor(){const s=mySkin();if(s.id!=='rainbow')return s.base;const g=cx.createLinearGradient(0,0,640,0);RAINBOW.forEach((c,i)=>g.addColorStop(i/7,c));return g}
function redraw(){cx.clearRect(0,0,640,260);
 if(!raw.length){cx.fillStyle='#6b7f60';cx.font=`20px ${DISP}`;cx.textAlign='center';cx.fillText('ここに草を一本描いてね',320,135);return}
 const lw=+$('#w').value,path=()=>{cx.beginPath();raw.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));if(raw.length==1)cx.lineTo(raw[0][0]+.1,raw[0][1])};
 cx.lineCap=cx.lineJoin='round';cx.lineWidth=lw+6;cx.strokeStyle=INK;path();cx.stroke();
 cx.lineWidth=lw;cx.strokeStyle=padColor();path();cx.stroke()}
function stat(m){
 $('#stat').textContent=m||(me?'この草でたたかうよ！':'まず草を描いてね');
 $('#mHp').textContent=me?me.hp:'-';$('#mPw').textContent=me?me.pw:'-';
 $('#mHpBar').style.width=me?clamp(me.hp/150,.05,1)*100+'%':'0';$('#mPwBar').style.width=me?clamp(me.pw/20,.05,1)*100+'%':'0';
 const ok=!!me,net=ok&&!!peerId;
 $('#cpu').disabled=!ok;$('#net').disabled=!net;$('#random').disabled=!net;$('#inviteMake').disabled=!net;$('#joinInv').disabled=!net;
}
function finishStem(){const r=resample(raw,8);if(r.length<6){me=null;return stat('もう少し長く描いてね')}
 let L=0,T=0,pa=null;for(let i=1;i<r.length;i++){const dx=r[i][0]-r[i-1][0],dy=r[i][1]-r[i-1][1];L+=Math.hypot(dx,dy);const a=Math.atan2(dy,dx);if(pa!==null){let d=Math.abs(a-pa);if(d>Math.PI)d=2*Math.PI-d;T+=d}pa=a}
 const wig=clamp(T/(r.length-2)/.8,0,1),w=+$('#w').value;me={p:norm(r),w,wig,...stats(w,wig,L)};stat();
 save.stem={p:resample(raw,6).map(a=>[Math.round(a[0]),Math.round(a[1])]),w};persist()}
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);drawing=true;raw=[pos(e)];me=null;redraw();stat()};
cv.onpointermove=e=>{if(!drawing)return;const p=pos(e),l=raw[raw.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])>2){raw.push(p);redraw()}};
cv.onpointerup=cv.onpointercancel=()=>{if(drawing){drawing=false;finishStem()}};
$('#w').oninput=()=>{redraw();if(raw.length&&!drawing)finishStem()};
$('#clr').onclick=()=>{raw=[];me=null;save.stem=null;persist();redraw();stat()};
function preset(kind){const a=[];let w=8;
 if(kind==='tough'){w=15;for(let x=70;x<=570;x+=5)a.push([x,130+Math.sin(x/110)*16])}
 else if(kind==='zig'){w=4;for(let i=0;i<=20;i++)a.push([70+i*25,i%2?200:60])}
 else{w=8;for(let x=70;x<=570;x+=5)a.push([x,130+Math.sin(x/42)*46])}
 raw=a;$('#w').value=w;redraw();finishStem();SFX.ui()}
document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>preset(b.dataset.preset));
if(save.stem){raw=save.stem.p.map(a=>[a[0],a[1]]);$('#w').value=save.stem.w;redraw();finishStem()}else redraw();

const NAMES=['ひよっこ草','ふつうの草','つよい草','あばれ草','ぬし草','草将軍'];
const BOSSES=['大横綱ミドリ','草の魔王グリーン','伝説のオオバコ神'];

function makeCpu(){
 const st=save.streak,boss=(st+1)%5===0,s=clamp(.8+st*.06,.8,1.7)*(lossRun>=2?.85:1);
 const wig=rnd(.1,.9),w=rnd(4,13),a=[];for(let i=0;i<60;i++)a.push([i*16,Math.sin(i/60*(3+wig*10))*wig*120]);
 const b=stats(w,wig,rnd(300,400)),hm=(.8+.25*s)*(boss?1.25:1),pm=(.85+.15*s)*(boss?1.1:1);
 return{p:norm(a),w,wig,hp:Math.round(b.hp*hm),pw:Math.round(b.pw*pm*10)/10,sk:boss?pick(['gold','rainbow']):pick(SKINS.map(x=>x.id)),
  name:boss?BOSSES[((st+1)/5-1)%BOSSES.length|0]:NAMES[Math.min(5,st>>1)],boss,tp:.5+.06*s};
}

function takeHit(dmg,n,crit){
 myHp-=dmg;tension=Math.min(1,tension+.12*Math.min(n,3));
 const now=performance.now();
 burst(W/2,150,Math.min(8,n*2+(crit?8:0)),{speed:crit?420:300,ang:Math.PI,spread:1.3,g:800,life:.5,size:5,cols:['#ff6b6b','#ffd0d0','#fff']});

function settle(r){
 const prev=save.streak,rs={gain:0,notes:[],leveled:[],prev};lastSettle={prev};
 let gain=0;
 if(r===true){save.wins++;save.streak++;save.best=Math.max(save.best,save.streak);gain=30+Math.min(save.streak,10)*4;
  if(S.mode==='cpu'){lossRun=0;if(opp&&opp.boss){gain*=2;rs.notes.push('ボス撃破 ×2')}}
  if(save.lastWin!==today()){gain*=2;rs.notes.push('今日の初勝利 ×2');save.lastWin=today()}}
 else if(r===false){save.losses++;save.streak=0;gain=8;if(S.mode==='cpu')lossRun++}
 else if(r==='draw')gain=10;
 if(gain&&S.mode==='net'){gain=Math.round(gain*1.5);rs.notes.push('オンライン ×1.5')}
 rs.gain=gain;save.xp+=gain;
 while(save.xp>=need(save.lv)&&save.lv<99){save.xp-=need(save.lv);save.lv++;rs.leveled.push(save.lv)}
 persist();renderMeta();renderSkins();return rs;
}

function msg(){if(res==='disconnect')info('通信が切れました。対戦を終了しました');}

/* ===== 描画 ===== */
function cloud(x,y,s){ax.fillStyle='rgba(255,255,255,.92)';for(const[dx,dy,r]of[[0,0,16],[16,-8,20],[36,0,16]]){ax.beginPath();ax.arc(x+dx*s,y+dy*s,r*s,0,7);ax.fill()}}
function drawBg(t){
 const g=ax.createLinearGradient(0,0,0,300);g.addColorStop(0,'#3fb7ff');g.addColorStop(1,'#cdf1ff');ax.fillStyle=g;ax.fillRect(-30,-30,W+60,H+60);
 ax.fillStyle='#fff6b0';ax.beginPath();ax.arc(572,58,30,0,7);ax.fill();
 cloud((t/50)%(W+160)-80,70,1);cloud((t/35+300)%(W+160)-80,40,.7);
 ax.fillStyle='#8be58f';ax.beginPath();ax.ellipse(110,306,250,78,0,0,7);ax.fill();ax.fillStyle='#62d27a';ax.beginPath();ax.ellipse(540,312,290,82,0,0,7);ax.fill();
 ax.fillStyle='#f3d99f';ax.fillRect(-30,298,W+60,H);ax.fillStyle='#d9b873';for(let i=0,x=10;x<W;x+=46,i++)ax.fillRect(x,326+(i%2)*14,18,4);
 ax.fillStyle=INK;ax.fillRect(-30,288,W+60,22);ax.fillStyle='#c48a2c';ax.fillRect(-30,291,W+60,16);ax.fillStyle='#e8b55a';for(let x=-6;x<W+20;x+=18)ax.fillRect(x,291,9,16); // 土俵の俵
}
function stem(s,mir,f,dx,broken,skin,fever,t){
 let mx=1,my=1;for(const[x,y]of s.p){mx=Math.max(mx,x);my=Math.max(my,y)}
 const bx=mir?340:20,bw=280,by=44,bh=232,k=Math.min(bw/mx,bh/my),ox=bx+(bw-mx*k)/2+dx,oy=by+(bh-my*k)/2;
 const P=s.p.map(([x,y])=>[ox+(mir?mx-x:x)*k,oy+y*k]);f=clamp(f,0,1);
 const lw=clamp(s.w*.9,4,14),col=fever?`hsl(${(t/5)%360} 95% 58%)`:stemColor(skin,f,t);ax.lineCap=ax.lineJoin='round';
 const path=(a,ex,ey,w,c)=>{ax.beginPath();a.forEach((p,i)=>i?ax.lineTo(p[0]+ex,p[1]+ey):ax.moveTo(p[0]+ex,p[1]+ey));ax.lineWidth=w;ax.strokeStyle=c;ax.stroke()};
 const draw2=(a,ex,ey)=>{path(a,ex,ey,lw+6,INK);path(a,ex,ey,lw,col)};
 if(broken){const e=clamp((performance.now()-endAt)/300,0,1),h=P.length>>1,q=mir?1:-1;draw2(P.slice(0,h+1),-14*e*q,-10*e);draw2(P.slice(h),14*e*q,10*e);return null}
 draw2(P,0,0);path(P,-1,-2,Math.max(1.5,lw*.25),'rgba(255,255,255,.45)');
 const n=Math.floor((1-f)*6);ax.strokeStyle='#ff3d5a';ax.lineWidth=3;
 for(let i=0;i<n;i++){const p=P[Math.floor((i+1)/(n+1)*(P.length-1))];ax.beginPath();ax.moveTo(p[0]-6,p[1]-6);ax.lineTo(p[0]+1,p[1]);ax.lineTo(p[0]-3,p[1]+7);ax.stroke()}
 return P;
}
function outlined(text,x,y,size,col,align='center'){ax.font=`${size}px ${DISP}`;ax.textAlign=align;ax.lineJoin='round';ax.lineWidth=Math.max(4,size*.2);ax.strokeStyle=INK;ax.strokeText(text,x,y);ax.fillStyle=col;ax.fillText(text,x,y)}
function drawArena(t){
 ax.save();ax.clearRect(0,0,W,H);
 const sh=FXS.shake;ax.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh);
 if(FXS.zoom>.002){ax.translate(W/2,H/2);ax.scale(1+FXS.zoom,1+FXS.zoom);ax.translate(-W/2,-H/2)}
 drawBg(t);
 const fever=FXS.fever&&S.state==='fight';
 if(fever){ax.fillStyle=`hsla(${(t/4)%360},100%,60%,.2)`;ax.fillRect(-30,-30,W+60,H+60);
  if(FX===1){ax.strokeStyle='rgba(255,255,255,.5)';ax.lineWidth=3;for(let i=0;i<24;i++){const a=Math.random()*6.283,r1=130+Math.random()*60,r2=r1+90+Math.random()*120;ax.beginPath();ax.moveTo(W/2+Math.cos(a)*r1,160+Math.sin(a)*r1*.7);ax.lineTo(W/2+Math.cos(a)*r2,160+Math.sin(a)*r2*.7);ax.stroke()}}}
 if(me){
  const d=S.state==='done',jit=(Math.random()-.5)*tension*8;
  lastP.me=stem(me,false,myHp/me.hp,-tension*12+jit,d&&res!==true,mySkin(),fever,t)||lastP.me;
  if(opp){lastP.opp=stem(opp,true,oppHp/opp.hp,tension*12-jit,d&&res!==false,oppSkin(),false,t)||lastP.opp;
   // 草どうしを引っかけたワッカ
   ax.lineWidth=5;ax.strokeStyle=INK;for(const x of[W/2-14,W/2+14]){ax.beginPath();ax.ellipse(x+jit,155,18,11,0,0,7);ax.stroke()}
   ax.lineWidth=2;ax.strokeStyle='#fff';for(const x of[W/2-14,W/2+14]){ax.beginPath();ax.ellipse(x+jit,155,18,11,0,0,7);ax.stroke()}}
 }
 // パーティクル
 for(const p of FXS.parts){const k=1-p.t/p.life;ax.globalAlpha=clamp(k*1.6,0,1);ax.fillStyle=ax.strokeStyle=p.col;ax.save();ax.translate(p.x,p.y);ax.rotate(p.rot);
  if(p.shape==='rect')ax.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);
  else if(p.shape==='leaf'){ax.beginPath();ax.ellipse(0,0,p.size,p.size*.45,0,0,7);ax.fill()}
  else if(p.shape==='line'){ax.lineWidth=2.5;ax.beginPath();ax.moveTo(-p.size,0);ax.lineTo(p.size,0);ax.stroke()}
  else{ax.beginPath();ax.arc(0,0,p.size*k+1,0,7);ax.fill()}
  ax.restore()}
 ax.globalAlpha=1;
 for(const r of FXS.rings){const k=r.t/r.life;ax.globalAlpha=1-k;ax.strokeStyle=r.col;ax.lineWidth=r.w*(1-k)+1;ax.beginPath();ax.arc(r.x,r.y,r.r0+(r.r1-r.r0)*k,0,7);ax.stroke()}ax.globalAlpha=1;
 for(const q of FXS.texts){const k=q.t/q.life,sc=q.t<.12?.5+q.t/.12*.9:1.4-Math.min(.4,(q.t-.12)*2);ax.globalAlpha=k>.7?1-(k-.7)/.3:1;outlined(q.text,q.x,q.y,q.size*sc,q.col)}ax.globalAlpha=1;
 ax.restore();
 // 画面固定のUI
 if(S.state==='done'&&res===false){ax.fillStyle='rgba(40,40,90,.3)';ax.fillRect(0,0,W,H)}
 if(me&&S.state==='fight'&&myHp/me.hp<.3){const g=ax.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,W*.6),a=.3+.15*Math.sin(t/110);g.addColorStop(0,'rgba(255,0,60,0)');g.addColorStop(1,`rgba(255,0,60,${a})`);ax.fillStyle=g;ax.fillRect(0,0,W,H)}
 if(S.state==='wait'){outlined('あいて待ち'+'.'.repeat((t/400|0)%4),W/2,120,36,'#fff')}
 if(FXS.combo>=2&&S.state==='fight'){const c=FXS.combo,col=c>=30?'#ff5ce1':c>=15?'#ff9a1f':c>=5?'#ffd60a':'#fff',s=1+FXS.comboPop*.35;
  ax.save();ax.translate(14,54);ax.scale(s,s);outlined(String(c),0,0,54,col,'left');outlined('COMBO',0,24,18,col,'left');ax.restore()}
 if(cd){const e=clamp((t-cdAt)/260,0,1),sc=1+(1-e)*.9;ax.save();ax.translate(W/2,170);ax.scale(sc,sc);outlined(cd,0,0,cd.length>1?84:110,cd.length>1?'#ffd60a':'#fff');ax.restore()}
}
let lastT=performance.now(),lastDock='',lastHeat='';
function tick(now){
 const dt=Math.min(.05,(now-lastT)/1000||0);lastT=now;
 const since=now-endAt,slow=S.state==='done'&&since<800?.25+.75*(since/800):1;  // 決着の瞬間はスローモーション
 tension*=Math.pow(.94,dt*60);stepFx(dt*slow);
 if(S.state==='done'&&res===true&&since<2200&&Math.random()<.6)for(let i=0;i<3;i++)spawn({x:rnd(0,W),y:-10,vx:rnd(-60,60),vy:rnd(120,260),g:260,life:2.6,t:0,size:9,col:pick(RAINBOW),shape:'rect',rot:rnd(0,6),vr:rnd(-10,10)}); // 紙吹雪
 if(S.state==='fight'){
  if(myHp<=0){if(S.mode==='net'&&room)room.emit('broke',{}).catch(()=>{});finish(false)}
  else if(S.mode==='cpu'&&oppHp<=0)finish(true);
  if(FXS.combo&&now-FXS.lastTap>430){FXS.combo=0;FXS.fever=false}
 }
 const heat=FXS.combo>=30?'3':FXS.combo>=15?'2':FXS.combo>=5?'1':'0';if(heat!==lastHeat){lastHeat=heat;$('#tap').dataset.heat=heat}
 const dk=S.state==='fight'?'f':S.state==='count'?'c':'';if(dk!==lastDock){lastDock=dk;$('#tap').hidden=!dk;$('#tap').disabled=dk!=='f';$('#tap').textContent=dk==='f'?'ひっぱれ！！':'じゅんび…'}
 $('#share').hidden=!(S.state==='done'&&res!=='disconnect');$('#invitebtn').hidden=!(S.mode==='net'&&S.state==='wait'&&!!activeRoomCode);
 if(me){const f=clamp(myHp/me.hp,0,1);$('#bm').style.width=f*100+'%';$('#hpm').classList.toggle('low',f<.3&&S.state==='fight')}
 const of=opp?clamp(oppHp/opp.hp,0,1):1;$('#bo').style.width=of*100+'%';$('#hpo').classList.toggle('low',of<.3&&S.state==='fight');
 const fl=$('#flash');fl.style.opacity=FXS.flash;fl.style.background=FXS.flashCol;
 const sh=FXS.shake;$('#match').style.transform=sh>1&&!$('#match').hidden?`translate(${(Math.random()-.5)*sh*.6}px,${(Math.random()-.5)*sh*.6}px)`:'';
 drawArena(now);requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ===== オンライン（PeerJS / WebRTC）。元の構成を維持し、ダメージ値の同期だけ追加 ===== */
function initPeer(){
 if(!window.Peer){$('#online').textContent='PeerJSを読み込めませんでした';return}
 peerClient=new Peer(undefined,{debug:1});
 peerClient.on('open',id=>{peerId=id;stat();startHeartbeat()});
 peerClient.on('connection',conn=>{
  // Redis側のマッチ通知より先にPeerJSの接続が届くことがあるので、先に取り付けて最初のhelloを取りこぼさない
  if(S.mode==='net'&&(S.state==='wait'||S.state==='ready')&&(!expectedPeer||conn.peer===expectedPeer))attachConnection(conn);
  else conn.close();
 });
 peerClient.on('disconnected',()=>{try{peerClient.reconnect()}catch(e){console.warn(e)}});
 peerClient.on('error',e=>{console.warn('PeerJS:',e);if(e.type==='peer-unavailable'&&S.mode==='net')info('相手への接続に失敗しました。もう一度お試しください。')});
}
function makeRoomAdapter(conn){
 const listeners=new Map();
 conn.on('data',packet=>{if(!packet||typeof packet.type!=='string')return;const set=listeners.get(packet.type);if(set)for(const fn of [...set]){try{fn({isMe:false,peer:conn.peer,data:packet.data})}catch(e){console.warn(e)}}});
 return{
  emit(type,data){return new Promise((resolve,reject)=>{if(!conn.open)return reject(new Error('接続がまだ開いていません'));try{conn.send({type,data});resolve()}catch(e){reject(e)}})},
  on(type,fn){if(!listeners.has(type))listeners.set(type,new Set());listeners.get(type).add(fn);return()=>listeners.get(type)?.delete(fn)},
  leave(){conn.close();return Promise.resolve()}
 };
}
function attachConnection(conn){
 if(activeConn&&activeConn!==conn){conn.close();return}
 activeConn=conn;expectedPeer=conn.peer;pendingConnections.delete(conn.peer);room=makeRoomAdapter(conn);
 unsubs=[room.on('hello',onHello),room.on('ready',onReady),room.on('tap',onTap),room.on('broke',onBroke)];
 const opened=()=>{if(activeConn!==conn)return;info('接続しました。草の状態を交換しています…');sendHello()};
 conn.on('open',opened);conn.on('close',()=>{if(activeConn!==conn)return;activeConn=null;room=null;unsubs=[];clearInterval(sendT);if(S.state==='fight')finish('disconnect');else if(S.state==='done')$('#go').hidden=true;else if(S.mode==='net'){S.state='wait';$('#go').hidden=true;info('相手との接続が切れました。戻って再接続してください')}});
 conn.on('error',e=>{console.warn('DataConnection:',e);if(S.state!=='done')info('通信エラーが発生しました')});
 if(conn.open)opened();
}
function connectToOpponent(remotePeerId){
 if(!validPeerId(remotePeerId)||remotePeerId===peerId){info('対戦相手のIDが不正です');return}
 expectedPeer=remotePeerId;
 if(activeConn){if(activeConn.peer===remotePeerId)return;activeConn.close();activeConn=null;room=null}
 if(peerId.localeCompare(remotePeerId)<0){info('相手に接続しています…');const conn=peerClient.connect(remotePeerId,{reliable:true,serialization:'json'});attachConnection(conn)}
 else info('相手からの接続を待っています…');
}
function validPeerId(s){return typeof s==='string'&&/^[a-zA-Z0-9_-]{4,128}$/.test(s)}
function sendHello(){if(room&&me)room.emit('hello',{p:me.p,w:me.w,hp:me.hp,pw:me.pw,sk:save.skin}).catch(()=>{})}
function onHello(m){if(m.isMe||(opp&&opp.peer!==m.peer))return;const d=m.data||{};
 if(!Array.isArray(d.p)||d.p.length<2||d.p.length>100||!['wait','ready','done'].includes(S.state))return;
 const first=S.state==='wait';
 opp={peer:m.peer,p:d.p.map(a=>[clamp(+a[0]||0,0,1000),clamp(+a[1]||0,0,1000)]),w:clamp(+d.w||6,2,16),hp:clamp(+d.hp||80,20,200),pw:clamp(+d.pw||10,3,25),sk:SKINS.some(s=>s.id===d.sk)?d.sk:'green',name:'あいて'};
 if(first){S.state='ready';prepare();$('#go').hidden=false;$('#go').textContent='準備OK';info('相手が来ました！準備OKを押してね');SFX.ui()}else if(S.state==='ready'){oppHp=opp.hp}}
function onReady(m){if(m.isMe||!opp||m.peer!==opp.peer)return;readyOpp=true;maybeStart()}
// 相手の連打：回数(c)と累計ダメージ(d)を受け取る。dは1回の受信で増やせる量に上限をつけて極端な値を弾く
function onTap(m){if(m.isMe||!opp||m.peer!==opp.peer)return;
 const dd=m.data||{},c=+dd.c||0,n=clamp(c-oppC,0,30);oppC=c;if(S.state!=='fight')return;
 let dmg;
 if(Number.isFinite(+dd.d)){const d=clamp(+dd.d,0,1e5);dmg=clamp(d-oppD,0,n*opp.pw*K*3);oppD=d}else dmg=n*opp.pw*K; // 1タップの最大は クリティカル2倍×コンボ1.5倍=3倍
 if(n>0)takeHit(dmg,n,n===1&&dmg>opp.pw*K*1.75)}
function onBroke(m){if(m.isMe||!opp||m.peer!==opp.peer)return;
 if(S.state==='fight')finish(true);
 else if(S.state==='done'&&res===false){ // ほぼ同時に両方切れた＝あいこ。さっき数えた負けを取り消す
  res='draw';msg();$('#resTitle').textContent='DRAW';$('#result').className='result draw';
  if(lastSettle){save.losses=Math.max(0,save.losses-1);save.streak=lastSettle.prev;persist();renderMeta()}info('あいこ！両方ブチッ')}}
function maybeStart(){if(readyMe&&readyOpp&&(S.state==='ready'||S.state==='done')){readyMe=readyOpp=false;prepare();beginCount()}}

async function clean(notify=true){
 const oldCode=activeRoomCode,wasNet=S.mode==='net'||!!searchMode;
 clearInterval(cpuT);clearInterval(sendT);clearTimeout(matchTimer);searchMode=null;searchBusy=false;hideResult();
 unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];
 const old=activeConn;activeConn=null;room=null;if(old){try{old.close()}catch(e){}}
 for(const c of pendingConnections.values()){try{c.close()}catch(e){}}pendingConnections.clear();expectedPeer='';opp=null;readyMe=readyOpp=false;cd='';resetFx();
 if(notify&&wasNet&&peerId){try{await apiPost({action:'cancel',roomCode:oldCode})}catch(e){console.warn('cancel:',e)}}
 activeRoomCode='';S.mode=null;S.state='idle';
}
async function pollSearch(){
 if(!searchMode||searchBusy)return;searchBusy=true;
 try{
  const data=searchMode==='random'?{action:'matchmake',peerId}:{action:'room-join',peerId,roomCode:activeRoomCode};
  const result=await apiPost(data);if(Number.isFinite(Number(result.online)))showOnline(result.online);
  if(result.status==='matched'&&result.peerId){const remote=result.peerId;searchMode=null;clearTimeout(matchTimer);info('相手が見つかりました。接続しています…');connectToOpponent(remote);return}
  if(searchMode==='random')info('対戦相手を探しています…（オンライン '+(result.online??'?')+' 人）');
  else info('部屋「'+activeRoomCode+'」で相手を待っています…友達を招待しよう！');
  if(searchMode==='random'&&Date.now()>searchDeadline){searchMode=null;clearTimeout(matchTimer);await apiPost({action:'cancel'});info('相手が見つかりませんでした。CPUと練習して、もう一度お試しください');return}
 }catch(e){const failedCode=activeRoomCode;searchMode=null;clearTimeout(matchTimer);info('オンライン対戦に接続できません：'+e.message);apiPost({action:'cancel',roomCode:failedCode}).catch(()=>{})}
 finally{searchBusy=false;if(searchMode)matchTimer=setTimeout(pollSearch,searchMode==='random'?1400:2200)}
}
async function startSearch(mode,code=''){
 if(!me)return;if(!peerId){stat('PeerJSに接続中です。少し待ってください');return}
 await clean();S.mode='net';S.state='wait';searchMode=mode;activeRoomCode=code;searchDeadline=Date.now()+120000;
 show('match');prepare();S.state='wait';$('#go').hidden=true;
 info(mode==='random'?'ランダムマッチで相手を探しています…':'部屋「'+code+'」で相手を待っています…');
 pollSearch();
}

/* ===== シェア・招待 ===== */
const baseUrl=()=>location.origin+location.pathname;
async function copyText(s){
 try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(s);return true}}catch(e){}
 try{const t=document.createElement('textarea');t.value=s;t.style.cssText='position:fixed;opacity:0';document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();return ok}catch(e){return false}
}
async function shareOut(text,url){
 try{if(navigator.share){await navigator.share({title:'草相撲',text,url});return}}catch(e){if(e&&e.name==='AbortError')return}
 toast(await copyText(text+' '+url)?'コピーしたよ！友達に送ろう':'コピーできませんでした');
}
const shareResult=()=>shareOut(save.streak>0?`草相撲で${save.streak}連勝中！（${titleOf(save.lv)} Lv.${save.lv}）君は何連勝できる？ #草相撲`:`草相撲、${titleOf(save.lv)} Lv.${save.lv}！勝負しよう！ #草相撲`,baseUrl());
const shareInvite=code=>shareOut('草相撲で勝負しよう！このURLを開いて草を描いたらすぐ対戦できるよ #草相撲',`${baseUrl()}?room=${code}`);
$('#share').onclick=shareResult;
$('#invitebtn').onclick=()=>shareInvite(activeRoomCode);
$('#inviteMake').onclick=()=>{if(!me||!peerId)return;const code=Math.random().toString(36).slice(2,8);$('#code').value=code;startSearch('room',code).then(()=>shareInvite(code))};
$('#joinInv').onclick=()=>{if(!inviteCode)return;const c=inviteCode;inviteCode='';$('#invite').hidden=true;startSearch('room',c)};

/* ===== ボタン配線 ===== */
$('#random').onclick=()=>startSearch('random');
$('#net').onclick=()=>{const code=$('#code').value.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,12);if(code.length<2){stat('部屋コードは2文字以上にしてね');return}startSearch('room',code)};
$('#cpu').onclick=async()=>{await clean();S.mode='cpu';startCpu()};
$('#go').onclick=()=>{$('#go').hidden=true;hideResult();
 if(S.mode==='cpu'){startCpu();return}
 if(!room){info('通信が切れています。対戦をやめて入り直してください');return}
 readyMe=true;room.emit('ready',{}).catch(()=>{});info('相手の準備を待っています…');maybeStart()};
// タップ：ボタンでも、アリーナ画面のどこでもOK。キーボードはスペース/Enter
const tapDown=e=>{e.preventDefault();myTap()};
$('#tap').onpointerdown=tapDown;$('#stage').onpointerdown=tapDown;$('#tap').oncontextmenu=e=>e.preventDefault();
addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&S.state==='fight'){e.preventDefault();if(!e.repeat)myTap()}});
$('#back').onclick=async()=>{await clean();show('draw');stat();renderMeta()};
addEventListener('beforeunload',()=>{if(peerId){const payload=JSON.stringify({action:'leave',sessionId,roomCode:activeRoomCode});try{navigator.sendBeacon('/api/match',new Blob([payload],{type:'application/json'}))}catch(e){}}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)heartbeat()});
initPeer();
</script>
